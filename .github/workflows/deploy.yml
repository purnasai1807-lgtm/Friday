name: Deploy FRIDAY AI to Render

on:
  push:
    branches: [main]
  workflow_dispatch:      # allow manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        # Uses the Render Trigger API via a Deploy Hook URL stored as a secret.
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set. Add it in GitHub -> Settings -> Secrets."
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered on Render."
